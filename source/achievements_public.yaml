    metric: { kind: time_reduction, value: "-20%" }

  - text: "Principal frontend developer on a public scientific app over a 1M+ node knowledge graph (open-source — see github.com/BlueBrain/core-web-app)."
    tags: [react, nextjs, frontend, scientific, neuroscience, graphdb]

  - text: "Received AA performance reviews two years running at EPFL Blue Brain with year-on-year improvement across all categories; authored 50+ merged pull requests across open-source knowledge-graph web apps (BlueBrain/nexus-web and BlueBrain/core-web-app)."
    tags: [performance_reviews, opensource, frontend, epfl]

  - text: "First technical hire at an early-stage startup that scaled to 10k+ active users and was acquired (real-time SaaS, ad-tech)."
    tags: [exits, leadership, adtech, scaling]

  # =====================================================================================
  # Independent AI Harnesses, Context Engine & Agent Tooling (transferable R&D)
  # =====================================================================================

  - text: "Built Forewisp (smitfire/context, 705 commits), an adaptive coding-agent context engine combining PostgreSQL + Qdrant/FTS5, two-stage JEV/Choice ranking, SHA-256 freshness gating, a pre-invocation lifecycle hook, and an MCP stdio control plane across 7 harnesses (~2.2 KB context slate in <16 ms); paired multi-model cleanroom benchmarks eliminated false-positive context injection (17,912 B to 0 B on S1; -31,758 B on S3), lifted solve rates (30 to 34 on 36 slots with 0% regressions; local 9B model 0/4 to 3/4 on S2 and 3/9 to 7/9 on S3), and cut tokens 8 to 12% and wall time 17 to 23%."
    tags: [ai, llm, agentic, mcp, context_management, evaluation, perf, opensource]
    metric: { kind: context_benchmark, value: "17,912 B to 0 B FP / 30 to 34 solves / -23% wall" }

  - text: "Audited coding-agent sandbox and permission boundaries empirically via a 21-cell live probe matrix across shell redirections, command substitutions, python/bun subprocesses, network fetches, and subagent vs agent-team skill preloading; replaced vendor documentation assumptions with verified guardrails, hid 10 zero-use skills from idle prompt context, and resolved global TypeScript 7 and Rust LSP tooling incompatibilities."
    tags: [ai_tooling, security, agentic, testing, productivity]

  - text: "Designed adversarial multi-agent verification pipelines for rule distillation and code review: falsified mined PR-review conventions through 3 independent skeptic agents against live code (662 comments distilled to 38 verified rules), and gated batch PR reviews with specialist reviewers plus cross-family secondary review, isolated worktree mutation controls, and dual adversarial verifiers per finding (95-agent batch runs, 0 errors)."
    tags: [ai_tooling, agentic, code_review, evaluation, quality]

  - text: "Created a 6-plugin modular agent harness ecosystem and persistent execution workbench (smitfire/ns-dsh, dsh-workbench, team, board, codemode, cuga, tui): worker-isolated node:vm Code Mode with SQLite FTS5 output slicing, realpath tool/intent policy guards, a 6-column HITL Kanban and cycle-checked DAG MCP server, and a multi-worktree orchestrator with per-card model routing, mid-session quota failover, stall watchdog, and non-author cross-family review gates (>=90% coverage gate; passed 8-hour soak and rollback qualification)."
    tags: [ai, agentic, mcp, architecture, testing, opensource]
    metric: { kind: reliability_soak, value: "8-hour soak (>=90% coverage)" }

  - text: "Built cross-harness engineering tooling (agent-dotfiles, local-role-kit, smitfire/cw): single-source-of-truth config hub syncing instructions, skills, and dual-protocol secret-scanner / TDD / pre-push hooks across 6+ coding agents; portable YAML role cards (37 tests) offloading log triage, multi-file digests, and fact extraction to a 3.3 GB local Ollama model in 0.7 to 5.0 s per call; Git-worktree + Claude Code workflow CLI."
    tags: [ai_tooling, security, devops, local_llm, productivity, opensource]

  - text: "Built bounded coding harnesses, grounded AI apps, and preregistered robotics simulations (smitosis, agent_smit, p-dashboard, drone-lab, rlm): container-isolated harnesses with frozen A/B skill gates (330 commits in smitosis), a portfolio impact dashboard whose assistant server-checks every entity name and figure against app data, an agent-native MuJoCo + C simulation toolkit (17.7x to 21.4x real-time 2-robot runs, saved-match geometry verifier, preregistered 5% optimization gate), and OpenAI tool-calling / Responses API chaining in Recursive Language Models (rlm)."
    tags: [ai, llm, agentic, rlm, simulation, evaluation, testing]

