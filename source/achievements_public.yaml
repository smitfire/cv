bullets:

  # =====================================================================================
  # Current role at Natzka (Aug 2026 - Nov 2026)
  # Data intelligence platform; AI Assistant + MCP platform delivery
  # =====================================================================================

  - text: "243 merged PRs (+77,062 / -12,641 net lines across 977 files on main; 0 open PRs left behind) in 15 weeks at Natzka (Aug 4 to Nov 18, 2026) across the AI Assistant, MCP server, security remediation, evaluation harness, and platform tooling."
    tags: [output, leadership, ai, mcp, natzka]
    metric: { kind: prs_merged, value: "243", files_changed: 977, as_of: 2026-11-18 }

  - text: "Shipped a docked, screen-aware Chat Panel across 7 product screens: browser-only ephemeral chats answered without server storage, live screen context passed as a user-message block outside cached system instructions (so user-written panel or cell titles never become instructions), bidirectional hover links lighting up referenced panels or table cells, panel and cell Ask AI actions, and inline result tables and dialogs."
    tags: [ai, llm, frontend, product, security, natzka]

  - text: "Shipped an 11-tool MCP server over the platform's AI tools as an OAuth resource server (RFC 9728 metadata, audience-bound tokens, 90s query cap) plus workflow list, start, and cancel write tools over MCP and chat, running strictly as the signed-in user with per-action permission checks and an atomic chat approval card claimed before execution so a resent message starts nothing."
    tags: [mcp, ai, agentic, security, api, human_in_the_loop, natzka]

  - text: "Hardened a tool-calling agent over customer data: prompt rules so customer-authored text in tool results is never read as instructions (prompt injection), per-query and per-turn budgets, least-privilege impersonated tokens, and a figure-grounding metric (also live in production logging) handling Swiss grouped numbers (1'284'500), strict thousands-group joining, separation of adjacent figures, and exclusion of the assistant's own prior replies so repeated hallucinations cannot self-validate."
    tags: [ai, llm, agentic, security, guardrails, evaluation, natzka]

  - text: "Cut model cost and context bloat across runtime and tenant controls: cached the static prompt prefix (tool declarations and system prompt, 47% of all input tokens sent), sent compact tables instead of full stored results, windowed long conversations past 60k tokens with a tool to read omitted earlier turns back, reused engine job-cache results on chat resume without persisting customer data, and added per-tenant daily token usage rollups with optional budget caps that refuse turns before calling the model."
    tags: [ai, llm, perf, cost, context_management, backend, natzka]
    metric: { kind: token_share, value: "47%" }

  - text: "Built and expanded the assistant's offline evaluation harness to 275 checks across 91 scored cases (186 total cases across 6 datasets), adding 20 unanswerable-data traps paired with answerable twins, multi-cube enterprise cases, long-thread history-cut cases, dual-pass small-model LLM-as-judge claim grading on AWS Bedrock (EU), per-turn latency/token/model stamps, a headless-Chromium UI replay driver with environment fail-fast, and a blind side-by-side human review sheet; audited 100 existing eval turns, uncovering 61 unscored turns and 3 impossible-to-pass checks."
    tags: [ai, llm, evaluation, testing, playwright, natzka]
    metric: { kind: eval_suite, value: "275 checks / 91 scored cases", as_of: 2026-11-18 }

  - text: "Moved the assistant onto AWS Bedrock (EU) behind a provider switch with service-account identity, upgraded the model after removing three prompt lines that suppressed parallel tool calls (with explicit user notices on declined turns), made query tools refuse filters a data cube cannot apply instead of returning silently unfiltered numbers, and shipped end-to-end answer ratings wired to self-hosted Langfuse traces and scores."
    tags: [ai, llm, aws, bedrock, prompt_engineering, data_residency, observability, langfuse, natzka]

  - text: "Built resilient chat UX and privacy-safe persistence: long-running turns survive disconnects with client re-attachment, URL-addressed conversation restore/delete stays consistent, whitelist chat persistence keeps queries while dropping tool results (customer data) and unknown SDK part types by default, and shared tool contracts (lib-ai-tools + api-mcp) plus statistical compute functions and deduplicated engine-query construction speed up analysis."
    tags: [reliability, privacy, security, backend, frontend, mcp, perf, natzka]

  - text: "Reviewed 54 PRs across 10 engineers and 3 repositories (113 review passes, 195 inline comments), combining a 10-lens specialist subagent roster and cross-family secondary review with isolated worktree repros, mutation controls, and trial merges; caught pre-production issues including HTML injection and sender spoofing in share emails, chatbot markdown off-origin exfiltration, missing group-profile authorization checks, non-UUID MCP environment ids, cross-turn chat-history corruption, and OAuth logins missing a resource parameter."
    tags: [code_review, security, quality, leadership, ai_tooling, natzka]
    metric: { kind: prs_reviewed, value: "54 PRs / 113 reviews / 195 inline comments", as_of: 2026-11-18 }

  - text: "Led remediation of an identity and access management code review: 15 merged fixes (+3,749 / -585) closing unguarded permission-annotated routes, cross-tenant token resets and member removals, role escalation through groups and invites, an async guard race, and missing owner checks on shared bundles; restricted IdP URLs to https public hosts (SSRF), anchored Authorization-header regexes (~100 ms ReDoS), protected JWKS refreshes, and redacted secrets from logs."
    tags: [security, auth, iam, oauth, backend, natzka]
    metric: { kind: security_fixes, value: "15" }

  - text: "Hardened CI/CD and client supply-chain security: fixed a frontend build writing the entire CI environment (secrets included) into the public JS bundle, stopped deploy artifacts from reading caches writable by PR jobs, blocked MCP tool error leakage of internal service URLs and tenant ids, enforced server-side chat tenant allowlists, and wrote customer MCP data-flow docs and consent-screen warnings."
    tags: [security, frontend, cicd, mcp, privacy, docs, natzka]

  - text: "Defined a 'should this test exist' gate for writers and reviewers, then audited unit, integration, and Playwright e2e suites across 9 merged PRs (+891 / -3,065): repaired false-green tests, removed duplicates naming the keeper test for each, extended the e2e 5xx guard to 432 of 576 tests previously skipping it, and fixed a flaky table-unmount reload test."
    tags: [testing, e2e, playwright, quality, leadership, ci, natzka]
    metric: { kind: test_audit, value: "9 PRs (+891 / -3,065)", as_of: 2026-11-18 }

  - text: "Built the team's AI-assisted engineering harness (CLAUDE.md as map, 11 single-responsibility agents, 21 progressive-disclosure skills including silent repo-specific failure traps): mined 662 review comments across 421 PRs through 3 skeptic agents to retain 38 verified review rules, built automated weekly on-call Slack plus attempt-1 GitHub Actions failure synthesis to Confluence and customer release-notes drafting (plus 13-minute CI e2e skip on config-only PRs), evaluated Senior Full-Stack candidate take-home submissions via live probes, and authored the AI Assistant capability-gap handover roadmap."
    tags: [ai_tooling, agentic, code_review, automation, hiring, leadership, productivity, natzka]
    metric: { kind: review_mining, value: "662 comments / 421 PRs / 38 rules" }

  # =====================================================================================
  # Previous role at a Zurich AI startup (Jul 2025 - Jul 2026)
  # 1st engineer / lead contributor on a production AI / LLM platform
  # =====================================================================================

  # ----- PERFORMANCE -------------------------------------------------------------------

  - text: "Achieved a ~3,370× vector-search speedup (25s → 7ms on a 162k-row table) by introducing pg_diskann to Postgres, enabling full 3072-dim cosine similarity natively (HNSW/IVFFlat are capped at 2000 dims on pgvector 0.8.0). Zero application code change."
    tags: [perf, vectordb, postgres, pgvector, diskann, embeddings, rag]
    metric: { kind: speedup, value: "3370x", before: "25s", after: "7ms", rows: "162k" }

  - text: "Lifted automated test coverage on a critical async / event-driven function set from 8% (2/26) to 100% (26/26) — added ~8,500 lines of integration + unit tests across 21 new files. Diagnosed and fixed a Bun mock.module() process-global leakage causing CI flakiness."
    tags: [perf, quality, testing, ci, inngest, bun]
    metric: { kind: coverage_uplift, value: "8% → 100%", lines_added: 8500 }

  - text: "Cut serverless function memory footprint 40-70% per request by splitting a 1,932-line monolithic catch-all route (37 endpoints, 40+ imports) into 9 focused serverless functions. Resolved memory exhaustion under Vercel Fluid Compute."
    tags: [perf, serverless, vercel, memory, architecture, refactor]
    metric: { kind: memory_reduction, value: "40-70%" }

  - text: "Reduced a long-running insights-generation job from ~7.5 min to ~45-60s (~10× faster) by replacing a sequential for-loop with Promise.all() + Inngest step.run() fan-out, with a concurrency cap of 10 to avoid overwhelming OpenAI."
    tags: [perf, parallelization, inngest, llm, openai]
    metric: { kind: speedup, value: "~10x", before: "7.5min", after: "45-60s" }

  - text: "Fixed ENOSPC ('no space left on device') failures on Vercel/Inngest serverless workers under heavy data import (28k+ records, large-payload streaming) by replacing a buffering SDK download with native fetch() + SAS URLs streaming directly to a Node Readable. Tested with a 2.6 GB payload."
    tags: [perf, serverless, azure, streaming, reliability]
    metric: { kind: payload_handled, value: "2.6GB" }

  - text: "Solved OpenAI's 50 MB image-payload limit on long multi-turn vision interactions — payloads dropping from ~73 MB to ~5 MB — by introducing a `compressedContent` JSONB column and a sharp-based 512px JPEG q70 compression utility, applied to past-turn images while keeping the current turn full-quality."
    tags: [perf, llm, openai, image_processing, postgres]
    metric: { kind: payload_reduction, value: "73MB → 5MB" }

  - text: "Worked around Postgres's hard 256 MB per-JSONB-value limit (JENTRY_OFFLENMASK = 2^28 - 1) blocking large data imports — designed an option-axis row split with a nullable offset column. Existing rows untouched (NULL = single self-contained row); split rows reassembled at read time."
    tags: [perf, postgres, scaling, schema_design, etl, jsonb]
    metric: { kind: limit_overcome, value: "256 MB JSONB" }

  - text: "Solved Inngest's 4 MB step output limit for large data imports by persisting warning arrays to a Postgres `result` JSONB column instead of returning them as step output, with type-only schema updates (no migration)."
    tags: [perf, inngest, etl, postgres, scaling]
    metric: { kind: limit_overcome, value: "4 MB step output" }

  - text: "Introduced streaming JSON parsing (`stream-json`) and a batched-commit strategy (2000 records, 20 segmentations per batch) into a critical import path, enabling memory-efficient ingestion of 2.6 GB+ files and avoiding PgBouncer connection timeouts."
    tags: [perf, etl, streaming, postgres, pgbouncer, scaling]
    metric: { kind: payload_handled, value: "2.6 GB" }

  # ----- BIG FEATURE BUILD-OUTS --------------------------------------------------------

  - text: "Designed and shipped a major new reporting capability end-to-end (~42k LOC) — backend infrastructure, frontend components, and report generation. Lets users compare results across custom-defined segments instead of being limited to default breakdowns. Re-computes NPS, A/B, Likert and ChoiceFrequency reports per segment."
    tags: [feature, fullstack, llm, postgres, frontend, backend, product]
    metric: { kind: loc_shipped, value: "~42k" }

  - text: "Built a streaming data-import system handling 2.7 GB+ JSON files: browser uploads to blob storage, server streams + parses incrementally with stream-json, embeddings generated in parallel via a batched embedding service. Replaced a hand-rolled prototype that crashed on serverless."
    tags: [feature, etl, streaming, embeddings, frontend, azure, inngest]
    metric: { kind: payload_handled, value: "2.7 GB+" }

  - text: "Architected a major schema overhaul — decomposed a JSONB array into 7 properly relational tables. Stores only non-derived data; quantitative stats computed from classifications at read time. Bundled with a backfill script (dry-run / --run / --verify modes)."
    tags: [feature, postgres, schema_design, migration, backend]

  - text: "Hardened a multi-step classification pipeline from silent corruption: replaced a parallel pattern (which dropped shared state) with a sequential two-step pipeline. Fixed customer-visible report mismatches across multiple question types."
    tags: [feature, llm, classification, reliability]

  - text: "Designed a per-package option-label override system — new junction table with nullable label/description overrides falling back to global defaults, plus admin UI with override editor, blue-dot indicators, and clear-override action."
    tags: [feature, fullstack, postgres, admin_ui, schema_design]

  # ----- TECHNOLOGICAL TRANSITIONS / NEW PIPELINES -------------------------------------

  - text: "Led the introduction of an AI Agent Skills + MCP (Model Context Protocol) framework — codified how Claude / Copilot / ChatGPT-style coding agents auto-discover release, ticket-tracker, and DB workflows. Standardised AI-assisted workflows team-wide rather than per-engineer."
    tags: [transition, ai, mcp, tooling, leadership, productivity]

  - text: "Migrated long-running LLM calls off the application's primary serverless runtime onto Inngest's distributed step.ai.infer() pattern — fixed connection severing where the host platform cut OpenAI requests mid-response. 3-step pattern (prepare → step.ai.infer → process-and-save): the function pauses during the LLM call, releasing compute and connection."
    tags: [transition, inngest, llm, openai, vercel, serverless, architecture]

  - text: "Led an Inngest Python SDK migration in a sibling service — large change spanning ~196 files / ~29k LOC; bundled with system overhaul work."
    tags: [transition, inngest, python, sdk_migration, ai, architecture]
    metric: { kind: loc_shipped, value: "~29k" }

  - text: "Implemented EU-region OpenAI endpoint routing across the platform for data-residency compliance."
    tags: [transition, openai, compliance, eu, data_residency]

  - text: "Introduced rate-limit handling, throttling, and reliability fixes across a sibling Python service — production guardrails for LLM-orchestrated work."
    tags: [transition, llm, reliability, throttling, inngest, observability]

  - text: "Set up a document-extract microservice end-to-end — Inngest async processing, GPU acceleration, validation UI, full document summary pipeline. ~38k LOC across initial scaffold + GPU acceleration + UI features."
    tags: [transition, new_service, inngest, gpu, ai_pipeline, etl]
    metric: { kind: loc_shipped, value: "~38k" }

  - text: "Established a data-service microservice (FastAPI) — weighted distributions, multi-country support, reference validation. From greenfield scaffolding to feature-complete API."
    tags: [transition, new_service, fastapi, python, api]

  # ----- CROSS-REPO / STORY ARCS ------------------------------------------------------

  - text: "Story-arc ownership: explored a research / experimentation phase, built an evaluation framework, then productionised the inference path as a reusable library + service and integrated it into the main app. End-to-end ownership of the AI / LLM stack from research to production."
    tags: [arc, ai, rag, llm, embeddings, vector_search, leadership, architecture]

