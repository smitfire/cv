  - text: "Led the introduction of an AI Agent Skills + MCP (Model Context Protocol) framework — codified how Claude / Copilot / ChatGPT-style coding agents auto-discover release, ticket-tracker, and DB workflows. Standardised AI-assisted workflows team-wide rather than per-engineer."
