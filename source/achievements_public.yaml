  - text: "Migrated long-running LLM calls off the application's primary serverless runtime onto Inngest's distributed step.ai.infer() pattern — fixed connection severing where the host platform cut OpenAI requests mid-response. 3-step pattern (prepare → step.ai.infer → process-and-save): the function pauses during the LLM call, releasing compute and connection."
    tags: [transition, inngest, llm, openai, vercel, serverless, architecture]

  - text: "Led an Inngest Python SDK migration in a sibling service — large change spanning ~196 files / ~29k LOC; bundled with system overhaul work."
