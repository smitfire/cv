  # ----- PERFORMANCE -------------------------------------------------------------------

  - text: "Achieved a ~3,370× vector-search speedup (25s → 7ms on a 162k-row table) by introducing pg_diskann to Postgres, enabling full 3072-dim cosine similarity natively (HNSW/IVFFlat are capped at 2000 dims on pgvector 0.8.0). Zero application code change."
    tags: [perf, vectordb, postgres, pgvector, diskann, embeddings, rag]
    metric: { kind: speedup, value: "3370x", before: "25s", after: "7ms", rows: "162k" }

  - text: "Lifted automated test coverage on a critical async / event-driven function set from 8% (2/26) to 100% (26/26) — added ~8,500 lines of integration + unit tests across 21 new files. Diagnosed and fixed a Bun mock.module() process-global leakage causing CI flakiness."
    tags: [perf, quality, testing, ci, inngest, bun]
    metric: { kind: coverage_uplift, value: "8% → 100%", lines_added: 8500 }

  - text: "Cut serverless function memory footprint 40-70% per request by splitting a 1,932-line monolithic catch-all route (37 endpoints, 40+ imports) into 9 focused serverless functions. Resolved memory exhaustion under Vercel Fluid Compute."
    tags: [perf, serverless, vercel, memory, architecture, refactor]
    metric: { kind: memory_reduction, value: "40-70%" }

  - text: "Reduced a long-running insights-generation job from ~7.5 min to ~45-60s (~10× faster) by replacing a sequential for-loop with Promise.all() + Inngest step.run() fan-out, with a concurrency cap of 10 to avoid overwhelming OpenAI."
    tags: [perf, parallelization, inngest, llm, openai]
    metric: { kind: speedup, value: "~10x", before: "7.5min", after: "45-60s" }

  - text: "Fixed ENOSPC ('no space left on device') failures on Vercel/Inngest serverless workers under heavy data import (28k+ records, large-payload streaming) by replacing a buffering SDK download with native fetch() + SAS URLs streaming directly to a Node Readable. Tested with a 2.6 GB payload."
    tags: [perf, serverless, azure, streaming, reliability]
    metric: { kind: payload_handled, value: "2.6GB" }

  - text: "Solved OpenAI's 50 MB image-payload limit on long multi-turn vision interactions — payloads dropping from ~73 MB to ~5 MB — by introducing a `compressedContent` JSONB column and a sharp-based 512px JPEG q70 compression utility, applied to past-turn images while keeping the current turn full-quality."
    tags: [perf, llm, openai, image_processing, postgres]
    metric: { kind: payload_reduction, value: "73MB → 5MB" }

  - text: "Worked around Postgres's hard 256 MB per-JSONB-value limit (JENTRY_OFFLENMASK = 2^28 - 1) blocking large data imports — designed an option-axis row split with a nullable offset column. Existing rows untouched (NULL = single self-contained row); split rows reassembled at read time."
    tags: [perf, postgres, scaling, schema_design, etl, jsonb]
    metric: { kind: limit_overcome, value: "256 MB JSONB" }

  - text: "Solved Inngest's 4 MB step output limit for large data imports by persisting warning arrays to a Postgres `result` JSONB column instead of returning them as step output, with type-only schema updates (no migration)."
    tags: [perf, inngest, etl, postgres, scaling]
    metric: { kind: limit_overcome, value: "4 MB step output" }

  - text: "Introduced streaming JSON parsing (`stream-json`) and a batched-commit strategy (2000 records, 20 segmentations per batch) into a critical import path, enabling memory-efficient ingestion of 2.6 GB+ files and avoiding PgBouncer connection timeouts."
    tags: [perf, etl, streaming, postgres, pgbouncer, scaling]
    metric: { kind: payload_handled, value: "2.6 GB" }

  # ----- BIG FEATURE BUILD-OUTS --------------------------------------------------------

  - text: "Designed and shipped a major new reporting capability end-to-end (~42k LOC) — backend infrastructure, frontend components, and report generation. Lets users compare results across custom-defined segments instead of being limited to default breakdowns. Re-computes NPS, A/B, Likert and ChoiceFrequency reports per segment."
    tags: [feature, fullstack, llm, postgres, frontend, backend, product]
    metric: { kind: loc_shipped, value: "~42k" }

  - text: "Built a streaming data-import system handling 2.7 GB+ JSON files: browser uploads to blob storage, server streams + parses incrementally with stream-json, embeddings generated in parallel via a batched embedding service. Replaced a hand-rolled prototype that crashed on serverless."
    tags: [feature, etl, streaming, embeddings, frontend, azure, inngest]
    metric: { kind: payload_handled, value: "2.7 GB+" }

  - text: "Architected a major schema overhaul — decomposed a JSONB array into 7 properly relational tables. Stores only non-derived data; quantitative stats computed from classifications at read time. Bundled with a backfill script (dry-run / --run / --verify modes)."
    tags: [feature, postgres, schema_design, migration, backend]

  - text: "Hardened a multi-step classification pipeline from silent corruption: replaced a parallel pattern (which dropped shared state) with a sequential two-step pipeline. Fixed customer-visible report mismatches across multiple question types."
    tags: [feature, llm, classification, reliability]

  - text: "Designed a per-package option-label override system — new junction table with nullable label/description overrides falling back to global defaults, plus admin UI with override editor, blue-dot indicators, and clear-override action."
    tags: [feature, fullstack, postgres, admin_ui, schema_design]

