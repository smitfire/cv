      - text: "Hardened a tool-calling agent over customer data: prompt-injection isolation, least-privilege impersonated tokens, per-query/per-turn budgets, whitelist chat persistence dropping tool results (customer data) by default, MCP error-leakage filtering, tenant allowlists, and a live figure-grounding metric handling Swiss grouped numbers while excluding prior assistant replies."
