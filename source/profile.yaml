# Pre-written summaries — Claude picks one and mutates the wording per JD.
summaries:
  ai_engineer: >
    Senior AI / fullstack engineer with 12+ years and three 1st-engineer / leadership-track
    builds — currently lead contributor at Delta Labs (Zurich, UZH spin-off, €4.4M seed
    Mar 2026). I design and ship production AI systems end-to-end: Recursive Language
    Models (RLM) inference, RAG pipelines, semantic search, prompt orchestration,
    multi-step agentic workflows (MCP / Model Context Protocol), document parsing /
    OCR ingestion, evaluation loops, and the reliability patterns (throttling, retry,
    circuit-breakers, observability) that keep them stable in production. Two prior
    exits as 1st engineer; CTO at a healthcare-data startup. Most effective at the
    intersection of AI systems, backend architecture, technical leadership, and product
    execution.

  fullstack_python: >
    Senior Python / AI engineer with 12+ years and three leadership-track builds.
    Currently lead contributor at Delta Labs (Zurich AI startup, €4.4M seed Mar 2026):
    production RAG, RLM inference, document parsing / OCR pipelines, agentic workflows
    (MCP), and the orchestration / evaluation / reliability layer that makes AI systems
    trustworthy. Strong Python (Flask, FastAPI, ETL), modern data tooling (Postgres +
    pgvector, Elasticsearch, vector DBs), and full-stack delivery (React, Next.js,
    TypeScript). Track record of measurable impact — 3,370× vector-search speedup,
    300% ETL throughput uplift, 10× DB query speed-ups, test coverage 5% → 85%, 50%+
    CI/CD time cut.

  fullstack: >
    Senior fullstack engineer (12+ yrs) with three 1st-engineer / leadership-track builds
    and two prior exits. Currently lead contributor at Delta Labs (Zurich AI startup,
    €4.4M seed Mar 2026), shipping production RAG, RLM, agentic and OCR systems
    end-to-end. I own backend services, AI / LLM pipelines, frontend, and the engineering
    practices around them. Strong on quality (5% → 85% test coverage), high-leverage
    architecture (3,370× vector-search speedup), and turning fast-moving product ideas
    into reliable, observable, production systems.

  frontend: >
    Senior frontend engineer (12+ years) building robust, performant web applications with
    React, Next.js, and TypeScript. Principal frontend developer for a SaaS platform
    serving 10k+ users; led UI development for EPFL's Blue Brain neuroscience tooling
    (Next.js + Elasticsearch over a 1M+ node knowledge graph). Strong collaborative and
    ownership mindset across startup and research environments.

  backend: >
    Senior backend / AI engineer with 12+ years building Python services, ETL pipelines,
    and distributed AI / LLM systems. Recent focus at Delta Labs (Zurich, €4.4M seed
    Mar 2026): production RAG and RLM inference, embedding and OCR / document-parsing
    pipelines (Azure, Postgres + pgvector), agentic workflows via MCP (Model Context
    Protocol), prompt orchestration, observability, throttling, and evaluation loops.
    Comfortable from greenfield architecture to scaling, reliability, and AI-quality
    work on inherited systems.

  cto: >
    Founding / lead engineer with 12+ years and three leadership-track builds (CTO at
    Ranova, lead contributor at Delta Labs, 1st technical hire at RTK.io / Magnite —
    two prior exits). I take products from zero to scale — backend, AI / LLM systems,
    data, frontend, infra, hiring, and the product / delegation work that comes with it.
    Most recently leading architecture, release management, agentic AI / MCP rollout
    and product execution at Delta Labs (Zurich AI startup, €4.4M seed Mar 2026); served
    as CTO at Ranova (Geneva, healthcare data, AWS-serverless migration, CI/CD overhaul).

