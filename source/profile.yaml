    bullets:
      - text: "Shipped core AI Assistant and a docked, screen-aware Chat Panel across 7 screens: browser-only ephemeral chats answered without server storage, live screen context passed as a user-message block outside cached system instructions, bidirectional hover links lighting up referenced panels or table cells, inline result tables/dialogs, and disconnect-resilient URL-addressed conversations."
