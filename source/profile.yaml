    production systems. Prior CTO at a healthcare-data startup; acquired exit
    at RTK.io / Magnite.

  frontend: >
    Senior frontend engineer (12+ years) building robust, performant web applications with
    React, Next.js, and TypeScript. Principal frontend developer for a SaaS platform
    serving 10k+ users; led UI development for EPFL's Blue Brain neuroscience tooling
    (Next.js + Elasticsearch over a 1M+ node knowledge graph). Strong collaborative and
