    coverage, 320+ PRs in 10 months. Prior CTO at a healthcare-data startup;
    acquired exit as 1st technical hire at RTK.io / Magnite.

  fullstack_python: >
    Senior Python / AI engineer (12+ yrs) and lead contributor at Delta Labs
    (Zurich AI startup, €4.4M seed Mar 2026): production RAG, RLM inference,
    OCR pipelines, agentic workflows (MCP), evaluation and reliability layer.
    Strong Python (FastAPI, Flask, ETL, async), SQL performance (3,370× via
    pg_diskann, 10× via index strategy), and full-stack delivery (React,
    Next.js, TypeScript). Prior CTO at a healthcare-data startup. Acquired
    exit as 1st technical hire at RTK.io / Magnite.

  fullstack: >
    Senior full-stack engineer (12+ yrs) and lead contributor at Delta Labs
    (Zurich AI startup, €4.4M seed Mar 2026), shipping production RAG, RLM,
    agentic and OCR systems end-to-end. Own backend, AI / LLM pipelines,
    frontend, and engineering practices around them. Strong on quality
