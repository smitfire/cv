# Pre-written summaries — Claude picks one and mutates the wording per JD.
summaries:
  ai_engineer: >
    Senior fullstack engineer with 12+ years building production software, currently
    operating as 1st engineer at an AI startup. I design and ship LLM systems end-to-end —
    RAG pipelines, semantic search, prompt orchestration, evaluation loops, and the
    reliability patterns (throttling, monitoring, guardrails) that keep them stable in
    production. Two prior exits as 1st engineer. Most effective at the intersection of AI
    systems, backend architecture, and product execution.

  fullstack_python: >
    Senior full stack Python engineer with 12+ years experience, specialised in Flask /
    FastAPI back-ends, ETL pipelines, and modern data tooling (Postgres, Elasticsearch,
    vector DBs). Track record of measurable impact — 300% ETL throughput uplift, 10x DB
    query speed-ups, test coverage from 5% to 85%, 50% CI/CD time reduction. Equally
    comfortable owning the front-end (React, Next.js, Streamlit) and the LLM layer.

  fullstack: >
    Senior fullstack engineer (12+ yrs) with 2 prior exits as 1st engineer. I own systems
    end-to-end — backend services, data pipelines, frontend, and the LLM layer where it
    applies. Strong on engineering quality (5%→85% test coverage at Delta Labs) and on
    turning fast-moving product ideas into reliable, observable, production systems.

  frontend: >
    Senior frontend engineer (12+ years) building robust, performant web applications with
    React, Next.js, and TypeScript. Principal frontend developer for a SaaS platform
    serving 10k+ users; led UI development for EPFL's Blue Brain neuroscience tooling
    (Next.js + Elasticsearch over a 1M+ node knowledge graph). Strong collaborative and
    ownership mindset across startup and research environments.

  backend: >
    Senior backend engineer with 12+ years building Python services, ETL pipelines, and
    distributed AI / LLM systems. Recent focus: production RAG and embedding pipelines
    (Azure, Postgres + pgvector), observability, throttling, evaluation loops. Comfortable
    in everything from greenfield architecture to scaling and reliability work on
    inherited systems.

  cto: >
    Founding / lead engineer with 12+ years and 2 exits as 1st engineer. I take products
    from zero to scale — backend, data, frontend, infra, hiring, and the product /
    delegation work that comes with it. Most recently led architecture, release management
    and product execution at Delta Labs (AI startup, Zurich) and served as CTO at Ranova
    (Geneva, healthcare data).

